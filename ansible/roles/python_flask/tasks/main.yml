---
# tasks file for python_flask

# Amazon Linux: install only python3 and pip
- name: Install python3 and pip (Amazon Linux)
  package:
    name:
      - python3
      - python3-pip
    state: present
  become: true
  when: ansible_facts['distribution'] == 'Amazon'

# Other distros: install python3, pip, and venv
- name: Install python3, pip, and venv (other distros)
  package:
    name:
      - python3
      - python3-venv
      - python3-pip
    state: present
  become: true
  when: ansible_facts['distribution'] != 'Amazon'

- name: Create app directory
  file:
    path: /opt/flask_app
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create virtualenv
  command: python3 -m venv /opt/flask_app/.venv
  args:
    creates: /opt/flask_app/.venv
