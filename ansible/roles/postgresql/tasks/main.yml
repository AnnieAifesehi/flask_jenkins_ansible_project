---
# Enable Amazon Linux extras for PostgreSQL (Amazon Linux)
- name: Enable Amazon Linux extras for PostgreSQL (Amazon Linux)
  when: ansible_facts['distribution'] == 'Amazon'
  command: amazon-linux-extras enable postgresql11
  become: true
  ignore_errors: true

# Install PostgreSQL on Amazon Linux (via package names for extras)
- name: Install PostgreSQL on Amazon Linux (via package names for extras)
  when: ansible_facts['distribution'] == 'Amazon'
  package:
    name:
      - postgresql11
      - postgresql11-server
    state: present
  become: true

# Amazon Linux 2023 - try install default postgresql-server
- name: Amazon Linux 2023 - try install default postgresql-server
  when: ansible_facts['distribution'] == 'Amazon'
  package:
    name: postgresql-server
    state: present
  register: amazon_pg_try
  ignore_errors: true
  become: true

- block:
  - name: Add PGDG repository RPM for EL9 (needed on Amazon Linux 2023)
    yum:
      name: https://download.postgresql.org/pub/repos/yum/reporpms/EL-9-x86_64/pgdg-redhat-repo-latest.noarch.rpm
      state: present
    become: true

  - name: Install PostgreSQL 15 server from PGDG repo
    package:
      name: postgresql15-server
      state: present
    become: true

  - name: Initialize PostgreSQL 15 database
    command: /usr/pgsql-15/bin/postgresql-15-setup initdb
    args:
      creates: /var/lib/pgsql/15/data/PG_VERSION
    become: true

  - name: Ensure PostgreSQL 15 service is started and enabled
    service:
      name: postgresql-15
      state: started
      enabled: true
    become: true
  when: amazon_pg_try is failed

# Install PostgreSQL packages (RedHat family non-Amazon)
- name: Install PostgreSQL packages (RedHat family non-Amazon)
  when: ansible_facts['os_family'] == 'RedHat' and ansible_facts['distribution'] != 'Amazon'
  package:
    name:
      - postgresql-server
      - postgresql
      - postgresql-contrib
    state: present
  become: true

# Initialize PostgreSQL database (RedHat family)
- name: Initialize PostgreSQL database (RedHat family)
  when: ansible_facts['os_family'] == 'RedHat' and ansible_facts['distribution'] != 'Amazon'
  command: /usr/bin/postgresql-setup --initdb
  args:
    creates: /var/lib/pgsql/data/PG_VERSION
  become: true

# Install PostgreSQL packages (Debian family)
- name: Install PostgreSQL packages (Debian family)
  when: ansible_facts['os_family'] == 'Debian'
  apt:
    name:
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present
    update_cache: true
  become: true

# Ensure PostgreSQL service is started and enabled (generic)
- name: Ensure PostgreSQL service is started and enabled (generic)
  service:
    name: "{{ 'postgresql-15' if (ansible_facts['distribution'] == 'Amazon' and (amazon_pg_try is failed)) else 'postgresql' }}"
    state: started
    enabled: true
  become: true

# Create DB
- name: Create DB
  become_user: postgres
  postgresql_db:
    name: devopsdb
    state: present

# Create devops user
- name: Create devops user
  become_user: postgres
  postgresql_user:
    name: devops
    password: password
    priv: "devopsdb:ALL"

# Populate users table - ensure DB encoding
- name: Populate users table - ensure DB encoding
  become_user: postgres
  postgresql_db:
    name: devopsdb
    state: present
    encoding: UTF-8

# Copy DB init SQL if present
- name: Copy DB init SQL if present
  copy:
    src: ../../../../db/init.sql
    dest: /tmp/init.sql
    owner: root
    mode: '0644'
  become: true
  ignore_errors: true

- name: Stat /tmp/init.sql
  stat:
    path: /tmp/init.sql
  register: init_sql_stat
  become: true

- name: Run DB init SQL (if present)
  become_user: postgres
  shell: psql -d devopsdb -f /tmp/init.sql
  when: init_sql_stat.stat.exists | default(false)
