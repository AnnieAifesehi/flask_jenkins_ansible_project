
# PostgreSQL role tasks (distro-aware)

# Always check if PostgreSQL is already installed
- name: Check if PostgreSQL is already installed
  stat:
    path: /usr/bin/postgres
  register: postgres_bin

- name: Try install default postgresql package
  package:
    name: postgresql-server
    state: present
  register: pg_default_install
  ignore_errors: true
  become: true
  when: not postgres_bin.stat.exists

- name: If default package installed, ensure service is started (generic)
  service:
    name: postgresql
    state: started
    enabled: true
  when: pg_default_install is succeeded
  become: true


- name: AL2023 - install OpenLDAP compatibility packages
  package:
    name:
      - openldap
      - openldap-compat
    state: present
  become: true
  when: ansible_facts['distribution'] == 'Amazon' and pg_default_install is failed and not postgres_bin.stat.exists


- name: AL2023 - add PGDG repo file (EL9 path)
  copy:
    dest: /etc/yum.repos.d/pgdg15.repo
    content: |
      [pgdg15]
      name=PostgreSQL 15 for EL-9 - $basearch
      baseurl=https://download.postgresql.org/pub/repos/yum/15/redhat/rhel-9-x86_64
      enabled=1
      gpgcheck=1
      gpgkey=https://download.postgresql.org/pub/repos/yum/RPM-GPG-KEY-PGDG
    owner: root
    mode: '0644'
  become: true
  when: ansible_facts['distribution'] == 'Amazon' and pg_default_install is failed and not postgres_bin.stat.exists


- name: AL2023 - refresh package cache
  command: dnf -y makecache
  become: true
  when: ansible_facts['distribution'] == 'Amazon' and pg_default_install is failed and not postgres_bin.stat.exists


- name: AL2023 - install postgresql15-server package
  package:
    name: postgresql15-server
    state: present
  become: true
  when: ansible_facts['distribution'] == 'Amazon' and pg_default_install is failed and not postgres_bin.stat.exists


- name: AL2023 - initialize PostgreSQL using vendor helper (if present)
  command: /usr/pgsql-15/bin/postgresql-15-setup initdb
  args:
    creates: /var/lib/pgsql/15/data/PG_VERSION
  become: true
  ignore_errors: true
  when: ansible_facts['distribution'] == 'Amazon' and pg_default_install is failed and not postgres_bin.stat.exists


- name: AL2023 - fallback initialize using initdb
  command: /usr/bin/initdb -D /var/lib/pgsql/data
  args:
    creates: /var/lib/pgsql/data/PG_VERSION
  become: true
  when: ansible_facts['distribution'] == 'Amazon' and pg_default_install is failed and not postgres_bin.stat.exists

- name: AL2023 - ensure PostgreSQL service is enabled and started
  service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - postgresql-15
    - postgresql
  become: true
  when: ansible_facts['distribution'] == 'Amazon' and pg_default_install is failed

# If the PGDG vendor unit (postgresql-15.service) is not present but the legacy
# distribution unit 'postgresql.service' exists, create a symlink from the
# legacy data path to the 15 data dir so the existing unit can find the cluster.
- name: AL2023 - check for postgresql-15 systemd unit
  stat:
    path: /usr/lib/systemd/system/postgresql-15.service
  register: pg15_unit
  become: true
  when: ansible_facts['distribution'] == 'Amazon' and pg_default_install is failed

- name: AL2023 - check for legacy postgresql systemd unit
  stat:
    path: /usr/lib/systemd/system/postgresql.service
  register: pg_legacy_unit
  become: true
  when: ansible_facts['distribution'] == 'Amazon' and pg_default_install is failed

- name: AL2023 - create legacy data dir symlink if needed
  file:
    src: /var/lib/pgsql/15/data
    dest: /var/lib/pgsql/data
    state: link
    owner: postgres
    group: postgres
  become: true
  when: ansible_facts['distribution'] == 'Amazon' and pg_default_install is failed and (pg15_unit.stat.exists is not defined or not pg15_unit.stat.exists) and pg_legacy_unit.stat.exists

# If the legacy unit exists but the legacy data dir is empty/missing, copy the
# initialized 15 data into the legacy path so the legacy unit can start.
- name: AL2023 - stat legacy PG_VERSION
  stat:
    path: /var/lib/pgsql/data/PG_VERSION
  register: legacy_pg_version
  become: true
  when: ansible_facts['distribution'] == 'Amazon' and pg_default_install is failed and pg_legacy_unit.stat.exists

- name: AL2023 - stat PG15 PG_VERSION
  stat:
    path: /var/lib/pgsql/15/data/PG_VERSION
  register: pg15_version
  become: true
  when: ansible_facts['distribution'] == 'Amazon' and pg_default_install is failed

- name: AL2023 - copy PG15 data into legacy data dir if legacy missing
  command: rsync -a /var/lib/pgsql/15/data/ /var/lib/pgsql/data/
  args:
    creates: /var/lib/pgsql/data/PG_VERSION
  become: true
  when: ansible_facts['distribution'] == 'Amazon' and pg_default_install is failed and (pg15_unit.stat.exists is not defined or not pg15_unit.stat.exists) and pg_legacy_unit.stat.exists and pg15_version.stat.exists and (legacy_pg_version.stat.exists is not defined or not legacy_pg_version.stat.exists)

- name: AL2023 - ensure ownership of legacy data dir after copy
  file:
    path: /var/lib/pgsql/data
    owner: postgres
    group: postgres
    recurse: yes
  become: true
  when: ansible_facts['distribution'] == 'Amazon' and pg_default_install is failed and pg_legacy_unit.stat.exists


- name: Install PostgreSQL packages (RedHat family non-Amazon)
  when: ansible_facts['os_family'] == 'RedHat' and ansible_facts['distribution'] != 'Amazon' and pg_default_install is failed
  package:
    name:
      - postgresql-server
      - postgresql
      - postgresql-contrib
    state: present
  become: true

- name: Initialize PostgreSQL database (RedHat family non-Amazon)
  when: ansible_facts['os_family'] == 'RedHat' and ansible_facts['distribution'] != 'Amazon' and pg_default_install is failed
  command: /usr/bin/postgresql-setup --initdb
  args:
    creates: /var/lib/pgsql/data/PG_VERSION
  become: true

- name: Install PostgreSQL packages (Debian family)
  when: ansible_facts['os_family'] == 'Debian'
  apt:
    name:
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present
    update_cache: true
  become: true

- name: Create DB
  become_user: postgres
  postgresql_db:
    name: devopsdb
    state: present

- name: Create devops user
  become_user: postgres
  postgresql_user:
    name: devops
    password: password
    db: devopsdb
    priv: "ALL"

- name: Ensure DB encoding
  become_user: postgres
  postgresql_db:
    name: devopsdb
    state: present
    encoding: UTF-8

- name: Copy DB init SQL if present
  copy:
    src: ../../../../db/init.sql
    dest: /tmp/init.sql
    owner: root
    mode: '0644'
  become: true
  ignore_errors: true

- name: Stat /tmp/init.sql
  stat:
    path: /tmp/init.sql
  register: init_sql_stat
  become: true

- name: Run DB init SQL (if present)
  become_user: postgres
  shell: psql -d devopsdb -f /tmp/init.sql
  when: init_sql_stat.stat.exists | default(false)
